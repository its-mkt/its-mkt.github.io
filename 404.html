<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>페이지를 찾을 수 없음 · 아이티스 포털</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --card: #ffffff; --text: #111827; --muted: #5b6472; --faint: #8b93a1;
    --line-strong: #cfd5de; --accent: #2563eb; --accent-hover: #1d4ed8; --accent-ink: #ffffff; --accent-soft: #e3ebff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --card: #161a21; --text: #e6e8ec; --muted: #a2a9b5; --faint: #737b88;
      --line-strong: #353c48; --accent: #6ea8fe; --accent-hover: #93bfff; --accent-ink: #0b1220; --accent-soft: #1e2a42;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center;
    padding: 32px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    background: var(--bg); color: var(--text); line-height: 1.5; word-break: keep-all;
    font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  main { max-width: 440px; }
  .num { margin: 0; font-size: clamp(88px, 24vw, 132px); font-weight: 800; line-height: 1; letter-spacing: -0.05em;
    color: var(--accent-soft); font-variant-numeric: tabular-nums; user-select: none; }
  h1 { margin: 8px 0 10px; font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
  p.desc { margin: 0; color: var(--muted); font-size: 15px; text-wrap: pretty; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 11px;
    font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: none; cursor: pointer; touch-action: manipulation;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid transparent; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line-strong); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 40px; color: var(--faint); font-size: 12.5px; }
  @media (max-width: 400px) { .actions .btn { flex: 1 1 auto; } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p class="desc">주소가 잘못 입력되었거나, 페이지가 이동 또는 삭제되었습니다.</p>
  <div class="actions">
    <a class="btn primary" href="/">아이티스 포털로 가기</a>
    <button type="button" class="btn ghost" id="back" hidden>이전 페이지</button>
  </div>
  <footer translate="no">its.itket.com</footer>
</main>
<script>
  (function () {
    var back = document.getElementById('back');
    if (history.length > 1) {
      back.hidden = false;
      back.addEventListener('click', function () { history.back(); });
    }
  })();
</script>
</body>
</html>
