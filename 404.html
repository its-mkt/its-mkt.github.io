<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- 사내 포털: 검색 노출 안 함, 링크(관리자 주소 등)도 따라가지 않게 -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>페이지를 찾을 수 없음 · 아이티스 포털</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/common.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; text-align: center;
    padding: var(--s-32) max(var(--s-16), env(safe-area-inset-right)) var(--s-32) max(var(--s-16), env(safe-area-inset-left)); }
  main { max-width: 448px; }
  .num { margin: 0; font-size: clamp(88px, 24vw, 132px); font-weight: 800; line-height: 1; letter-spacing: -0.05em;
    color: var(--accent-tint); font-variant-numeric: tabular-nums; user-select: none; }
  h1 { margin: var(--s-8) 0 var(--s-12); font-size: var(--fs-xl); line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
  .desc { margin: 0; color: var(--muted); font-size: var(--fs-md); text-wrap: pretty; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s-8); margin-top: var(--s-28); }
  footer { margin-top: var(--s-40); color: var(--faint); font-size: var(--fs-xs); }
  @media (max-width: 400px) { .actions .btn { flex: 1 1 auto; } }
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p class="desc">주소가 잘못 입력되었거나, 페이지가 이동 또는 삭제되었습니다.</p>
  <div class="actions">
    <a class="btn lg primary" href="/">아이티스 포털로 가기</a>
    <button type="button" class="btn lg" id="back" hidden>이전 페이지</button>
  </div>
  <footer translate="no">its.itket.com</footer>
</main>
<script>
  (function () {
    var back = document.getElementById('back');
    if (history.length > 1) {
      back.hidden = false;
      back.addEventListener('click', function () { history.back(); });
    }
  })();
</script>
</body>
</html>
