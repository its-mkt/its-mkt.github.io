<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- 사내 포털: 검색 노출 안 함, 링크(관리자 주소 등)도 따라가지 않게 -->
<meta name="color-scheme" content="light dark">
<!-- theme-color = common.css 의 --card (라이트 #ffffff · 다크 #161a21) — 바꾸면 같이 고친다 -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a21" media="(prefers-color-scheme: dark)">
<title>아이티스 포털</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="common.css">
<style>
  /* 화면 폭 기준 (기기 단위): ~767 휴대폰 · 768 태블릿(2열) · 1024 작은 PC(리스트형 주소 보임) · 1280 PC(4열) */
  :root { --hd-h: 64px; --wrap-w: 1280px; --gutter-r: max(var(--s-16), env(safe-area-inset-right)); --gutter-l: max(var(--s-16), env(safe-area-inset-left));
    --card-pad: var(--s-16); } /* 카드 안쪽 여백 — 휴대폰(767px 이하)은 12px */

  /* ── 페이지 틀 ─────────────────────────────── */
  html { scroll-padding-top: calc(var(--hd-h) + env(safe-area-inset-top) + var(--s-16)); } /* 고정 머리(노치 여백 포함)에 바로가기 위치·키보드 포커스가 가리지 않게 */
  @media (pointer: fine) { html { overscroll-behavior: none; } }
  .skip { --ring-color: var(--text); position: absolute; left: var(--s-16); top: -48px; z-index: 30; } /* 모양은 .btn.primary */
  .skip:focus-visible { top: var(--s-12); }
  .wrap { max-width: var(--wrap-w); margin: 0 auto; padding: var(--s-32) var(--gutter-r) max(var(--s-16), env(safe-area-inset-bottom)) var(--gutter-l); } /* 아래: 홈 표시줄(노치 폰) 여백 */
  #groups:focus { outline: none; } /* 건너뛰기 링크로 온 포커스는 테두리 없이 */

  /* ── 머리 .hd — 화면 위에 붙는 바 (카드 이름 줄 .top 과 다른 이름) ── */
  .hd { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top); background: var(--card); border-bottom: 1px solid var(--line); }
  .hd-in { max-width: var(--wrap-w); height: var(--hd-h); margin: 0 auto; padding: 0 var(--gutter-r) 0 var(--gutter-l);
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-16); }
  .brand { --ring-o: var(--s-4); display: flex; align-items: center; gap: var(--s-12); min-width: 0; border-radius: var(--r-8); color: inherit; text-decoration: none; }
  .mark { flex: none; display: block; width: 32px; height: 32px; }
  .mark img { display: block; width: 100%; height: 100%; }
  h1 { margin: 0; font-size: var(--fs-lg); line-height: 1.25; letter-spacing: -0.02em; white-space: nowrap; }

  /* ── 검색 — 칸 안에 돋보기 · '/' 안내 · 결과 수 · 지우기 버튼이 겹쳐 놓인다 ── */
  .search { position: relative; flex: 0 1 320px; min-width: 0; }
  .search > .lens, .search > .kbd, .search > .status, .search > .clear { position: absolute; top: 50%; transform: translateY(-50%); }
  .lens { left: var(--s-12); display: block; color: var(--faint); pointer-events: none; }
  .search input { width: 100%; height: 40px; padding: 0 var(--s-48) 0 var(--s-40); border: 1px solid var(--line); border-radius: var(--r-8);
    background: var(--bg); color: var(--text); font: inherit; font-size: var(--fs-md); -webkit-appearance: none; appearance: none;
    transition: border-color var(--dur) ease, box-shadow var(--dur) ease; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:hover { border-color: var(--line-strong); }
  .search input:focus-visible { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 var(--s-4) var(--accent-soft); }
  .search > .kbd { right: var(--s-12); height: 24px; }
  /* 결과 수: 지우기 버튼 왼쪽에 짧게("3개") — 화면 읽기에는 전체 안내 */
  .search > .status { right: var(--s-40); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
  .clear { right: var(--s-4); display: none; color: var(--muted); } /* 모양은 .ibtn.md */
  .search.has-value input { padding-right: calc(var(--s-48) + var(--s-40)); } /* 결과 수("12개") + 지우기 버튼 자리 */
  .search.has-value .kbd { display: none; }
  .search.has-value .clear { display: grid; }
  @media (pointer: coarse) { .search > .kbd { display: none; } }

  /* ── 보기 방식 전환 (카드형 · 리스트형) — 목록 위 오른쪽, 아이콘만 ── */
  .viewbar { display: flex; justify-content: flex-end; margin-bottom: var(--s-16); }
  .seg { display: inline-flex; gap: var(--s-2); padding: var(--s-2); border: 1px solid var(--line); border-radius: var(--r-8); background: var(--card); }
  .seg button { border-radius: var(--r-4); color: var(--muted); } /* 모양은 .ibtn */
  .seg button:hover { background: transparent; color: var(--text); } /* 바탕은 고른 버튼에만 */
  .seg button[aria-pressed="true"] { background: var(--chip); color: var(--text); }

  /* ── 묶음 · 카드 격자 ─────────────────────── */
  .sec { margin-top: var(--s-40); }
  .sec:first-of-type { margin-top: 0; }
  .sec h2 { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-8); margin: 0 0 var(--s-16); font-size: var(--fs-md); font-weight: 700; text-wrap: balance; }
  .sec h2 .count { font-size: var(--fs-xs); background: var(--card); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } /* 바탕과 구분: 카드 색 + 테두리 */
  .sec h2 small { font-size: var(--fs-xs); font-weight: 400; color: var(--faint); }
  .t1 { --tone: var(--tone-1); --soft: var(--tone-1-soft); }
  .t2 { --tone: var(--tone-2); --soft: var(--tone-2-soft); }
  .t3 { --tone: var(--tone-3); --soft: var(--tone-3-soft); }
  .t4 { --tone: var(--tone-4); --soft: var(--tone-4-soft); }
  /* 짝수 열: 휴대폰 1 → 태블릿 2 → PC 4 (묶음이 2·4개 단위라 홀수 열은 카드가 남는다) */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-16); }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  /* ── 카드 ─────────────────────────────────── */
  .card { --ring-color: var(--tone); position: relative; display: flex; flex-direction: column; min-width: 0; padding: var(--card-pad);
    border: 1px solid var(--line); border-radius: var(--r-16); background: var(--card);
    transition: border-color var(--dur) ease, box-shadow var(--dur) ease, transform var(--dur) ease; }
  /* 호버 효과는 마우스가 있는 화면에서만 — 휴대폰에선 누른 뒤에도 떠 있는 채로 남기 때문 */
  @media (hover: hover) { .card:not(.soon):hover { border-color: var(--tone); box-shadow: var(--shadow); transform: translateY(calc(var(--s-2) * -1)); } } /* 준비 중 카드는 반응 없음 */
  .card:active { transform: translateY(0); }
  .card:has(.main:focus-visible) { outline: var(--ring-w) solid var(--ring-color); outline-offset: var(--s-2); border-color: var(--tone); }
  .card .main { flex: 1; display: flex; align-items: flex-start; gap: var(--s-16); min-width: 0; color: inherit; text-decoration: none; }
  .card .main::after { content: ''; position: absolute; inset: 0; border-radius: var(--r-16); } /* 카드 전체를 누를 수 있게 */
  .card .main:focus-visible { outline: none; } /* 테두리는 카드(:has)에 그린다 */
  .body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top { display: flex; align-items: center; gap: var(--s-8); min-width: 0; }
  .name { margin: 0; line-height: inherit; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.01em; }
  /* 화살표(바깥 ↗ · 포털 안 →): 주소 줄 끝에 작게 — 오른쪽 위는 ☆ 자리 */
  .go { flex: none; margin-left: var(--s-4); color: var(--faint); transition: color var(--dur) ease, transform var(--dur) ease; }
  /* 카드 호버 → 주소·화살표 강조. 바로 가기 칩에 올리면 그 칩만 강조하고 주소·화살표는 원래대로 */
  @media (hover: hover) {
    .card:hover:not(:has(.subs a:hover)) .url,
    .card:hover:not(:has(.subs a:hover)) .go { color: var(--tone); }
    .card:hover:not(:has(.subs a:hover)) .go { transform: translateX(var(--s-2)); }
    .card:hover:not(:has(.subs a:hover)) .go.ext { transform: translate(var(--s-2), calc(var(--s-2) * -1)); }
  }
  .desc { min-width: 0; margin-top: var(--s-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: var(--fs-sm); } /* 1줄 통일 */
  /* 주소: 1줄, 넘치면 … — 글자(.u)만 자르고 화살표는 늘 보이게 옆에 남긴다 */
  .url { display: flex; align-items: center; min-width: 0; margin-top: var(--s-12); color: var(--faint); font-size: var(--fs-xs); transition: color var(--dur) ease; }
  .url .u { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* 준비 중 */
  .card.soon { background: transparent; border-style: dashed; border-color: var(--line-strong); cursor: default; }
  .card.soon .ico { background: var(--chip); color: var(--faint); }
  /* 사이트 로고 타일(.logo): 로고가 흰 바탕용이라 다크 모드에서도 흰 바탕 + 옅은 테두리 */
  .ico.logo { background: #fff; box-shadow: inset 0 0 0 1px rgba(16, 24, 40, .08); }
  .ico.logo img { display: block; width: 24px; height: 24px; object-fit: contain; }
  .card.soon .ico.logo { background: #fff; }
  .card.soon .ico.logo img { filter: grayscale(1); opacity: .56; }
  .card.soon .name { color: var(--muted); }
  .card.soon .desc { color: var(--faint); }

  /* ── 즐겨찾기 ☆ .star — 카드 오른쪽 위에 늘 보인다 (안 고름: 흐린 ☆ · 고름: 채운 ★) ── */
  .card:not(.soon) .top { padding-right: calc(var(--ibtn) + var(--s-4)); } /* ☆ 자리 */
  .star { position: absolute; z-index: 2; top: var(--card-pad); right: calc(var(--card-pad) - var(--s-4)); } /* 모양은 .ibtn · 카드 여백을 따라 움직임 */
  @media (hover: hover) { .star:hover { color: var(--star); } }
  .star[aria-pressed="true"] { color: var(--star); }
  .star[aria-pressed="true"] svg { fill: currentColor; }
  /* 즐겨찾기 묶음 — 맨 위. 카드는 원래 묶음 색(.t1~.t4)을 그대로 가져온다 */
  .sec.fav { --tone: var(--star); --soft: var(--star-soft); }

  /* ── 바로 가기 ─────────────────────────────
     평소엔 카드 폭에 들어가는 만큼 한 줄. '더보기'를 누르면(PC·휴대폰·키보드 같음)
     카드 높이는 그대로 둔 채 판이 위로 올라오고 가려진 칩이 차례로 떠오른다 (최대 2줄 · 6개).
     높이(--subs-c 접힘 · --subs-o 펼침 · --subs-h 자리)는 fitSubs() 가 재서 넣는다 */
  .subs { position: relative; z-index: 1; margin-top: var(--s-16); height: var(--subs-h, auto);
    pointer-events: none; } /* 칩·더보기 말고 판의 빈 곳을 누르면 아래 카드 링크로 */
  .subs a, .subs-row > .soon, .subs-more { pointer-events: auto; } /* 준비 중 칩도 눌러서 카드 링크로 새지 않게 */
  .subs-in { position: absolute; left: calc(var(--s-4) * -1); right: calc(var(--s-4) * -1); bottom: calc(var(--s-4) * -1);
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: var(--s-12); padding: var(--s-16) var(--s-4) var(--s-4);
    border-top: 1px dashed var(--line); background: var(--card); overflow: hidden;
    min-height: var(--subs-c, 0); max-height: var(--subs-c, none); /* 접힌 높이를 모든 카드가 같게 */
    transition: max-height var(--dur-m) var(--ease-std), box-shadow var(--dur-m) ease; }
  .subs-head { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s-8);
    height: 20px; /* 더보기 버튼 유무와 상관없이 높이 고정 */ }
  .subs-label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .02em; color: var(--faint); }
  .subs-more { flex: none; display: inline-flex; align-items: center; height: 20px; white-space: nowrap; padding: 0 var(--s-2); border: 0; border-radius: var(--r-8); background: none;
    font: inherit; font-size: var(--fs-xs); font-weight: 600; line-height: 1; color: var(--faint); cursor: pointer;
    transition: color var(--dur) ease; }
  @media (hover: hover) { .subs-more:hover { color: var(--tone); } } /* 휴대폰: 누른 뒤 색이 남지 않게 */
  .subs-more .chev { margin-left: var(--s-2); transition: transform var(--dur-m) var(--ease-out); } /* 누를 수 있다는 표시 — 펼치면 위로 뒤집힘 */
  .card.open .subs-more .chev { transform: rotate(180deg); }
  @media (hover: hover) {
    .subs-more:hover .chev { transform: translateY(var(--s-2)); }
    .card.open .subs-more:hover .chev { transform: rotate(180deg) translateY(var(--s-2)); }
  }
  /* 칩 줄 */
  .subs-row { flex-basis: 100%; min-width: 0; display: flex; flex-wrap: wrap; gap: var(--s-8);
    padding: var(--s-4); margin: calc(var(--s-4) * -1); }
  /* 칩 모양은 .chip (common.css) */
  .subs a:focus-visible, .subs a:active { background: var(--soft); color: var(--tone); } /* :active — 휴대폰에서 누르는 순간 */
  @media (hover: hover) { .subs a:hover { background: var(--soft); color: var(--tone); } }
  /* 호버·포커스 때 화살표: 글자 옆에 붙어 나오며 칩이 오른쪽으로 그만큼(4 + 12px) 넓어진다 */
  .subs a .sa { flex: none; width: 0; margin-left: 0; opacity: 0;
    transition: width var(--dur) ease, margin-left var(--dur) ease, opacity var(--dur) ease; }
  .subs a:focus-visible .sa { width: 12px; margin-left: var(--s-4); opacity: 1; }
  @media (hover: hover) { .subs a:hover .sa { width: 12px; margin-left: var(--s-4); opacity: 1; } }
  /* 준비 중 칩 (sub 에 주소 없이 적은 것) — 누를 수 없는 점선 칩 */
  .subs-row > .soon { gap: var(--s-4); background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: default; }
  .subs-row > .soon small { font-size: var(--fs-2xs); }
  .subs-row > .over { display: none; } /* 셋째 줄로 넘치는 칩 */
  .subs-row > .x { opacity: 0; visibility: hidden; transform: translateY(var(--s-8)); /* 둘째 줄 칩: 펼칠 때 떠오름 · 접혀 있으면 Tab 도 안 감 */
    transition: opacity var(--dur) ease, transform var(--dur) ease, visibility 0s linear var(--dur), background-color var(--dur) ease, color var(--dur) ease; }
  /* 펼침 — '더보기'(.open) (#groups.measure 는 크기를 잴 때 잠깐 끈다) */
  #groups:not(.measure) .card.sub.open .subs-in {
    max-height: var(--subs-o, 320px); box-shadow: 0 calc(var(--s-12) * -1) var(--s-12) calc(var(--s-4) * -1) var(--card);
    transition: max-height var(--dur-l) var(--ease-out), box-shadow var(--dur-l) ease; }
  #groups:not(.measure) .card.sub.open .subs-row > .x { opacity: 1; visibility: visible; transform: none;
    transition: opacity .26s ease calc(var(--k, 0) * 45ms + 90ms), transform .32s var(--ease-out) calc(var(--k, 0) * 45ms + 90ms),
      visibility 0s, background-color var(--dur) ease, color var(--dur) ease; }
  #groups.measure .subs-in, #groups.measure .subs-row > .x { transition: none; }

  /* ── 리스트형 (#groups.list) — 묶음마다 한 판에 줄로 이어 붙인다. 바로 가기는 ⌄(.acc) 로 줄 아래에 펼친다 ── */
  #groups.list .grid { grid-template-columns: minmax(0, 1fr); gap: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-16); background: var(--card); }
  #groups.list .card { flex-direction: row; flex-wrap: wrap; align-items: center; padding: var(--s-12) var(--card-pad); border: 0; border-radius: 0; background: transparent; }
  #groups.list .card:not([hidden]) ~ .card { border-top: 1px solid var(--line); } /* 보이는 첫 줄 뒤부터 (검색으로 숨은 카드는 안 셈) */
  @media (hover: hover) { #groups.list .card:not(.soon):hover { transform: none; box-shadow: none; background: var(--bg); } }
  #groups.list .card:not(.soon):active { background: var(--bg); } /* 휴대폰: 누르는 순간만 줄 바탕 (펼친 뒤 회색이 남지 않게) */
  #groups.list .card:has(.main:focus-visible) { outline-offset: calc(var(--ring-w) * -1); }
  #groups.list .card .main { align-items: center; gap: var(--s-12); }
  #groups.list .card .main::after { border-radius: 0; }
  #groups.list { --ico-row: 40px; } /* 리스트형 아이콘 크기(= 카드형 .ico.lg 40px, 덮어쓰지 않음) — 펼친 칩 줄 들여쓰기 · ☆⌄ 세로 위치가 이 값을 따른다 */
  #groups.list .body { flex-direction: row; align-items: center; gap: var(--s-16); padding-right: var(--s-24); }
  #groups.list .top { flex: 0 0 240px; }
  #groups.list .desc { flex: 1 1 auto; margin: 0; }
  #groups.list .url { flex: none; max-width: 240px; margin: 0; }
  #groups.list .subs { display: none; }
  #groups.list .card:not(.soon) .top { padding-right: 0; }
  #groups.list .card:not(.soon) .body { padding-right: calc(var(--s-64) + var(--s-8)); } /* ⌄ + ☆ 자리 — ⌄ 없는 줄도 같게 해서 주소 끝을 맞춘다 */
  /* ☆ · ⌄ 는 첫 줄 가운데에 고정 (펼쳐서 줄이 길어져도 움직이지 않게) */
  #groups.list .star, #groups.list .acc { top: calc(var(--s-12) + var(--ico-row) / 2); margin-top: calc(var(--ibtn) / -2); } /* 줄 위 여백 12 + 아이콘 절반 = 첫 줄 가운데 */
  /* 아코디언 ⌄ — 리스트형 + 바로 가기가 있는 줄에만 */
  .acc { display: none; }
  #groups.list .card.sub .acc { position: absolute; z-index: 2; right: calc(var(--card-pad) - var(--s-4) + var(--ibtn) + var(--acc-gap, 0px)); display: inline-grid; } /* 모양은 .ibtn · ☆ 바로 왼쪽, 카드 여백을 따라 움직임 */
  #groups.list .acc svg { transition: transform var(--dur-m) var(--ease-out); }
  #groups.list .card.expand .acc { color: var(--tone); }
  #groups.list .card.expand .acc svg { transform: rotate(180deg); }
  /* 펼친 칩 줄: 아이콘 오른쪽 선에 맞춰 다음 줄로, 모든 칩(둘째·셋째 줄 포함)을 그대로 보여 준다 */
  #groups.list .card.expand .subs { display: block; flex-basis: 100%; height: auto; margin: var(--s-12) 0 var(--s-4) calc(var(--ico-row) + var(--s-12)); }
  #groups.list .card.expand .subs-in { position: static; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-8);
    min-height: 0; max-height: none; padding: 0; border: 0; background: transparent; box-shadow: none; overflow: visible; }
  #groups.list .card.expand .subs-head { display: none; }
  #groups.list .card.expand .subs-row { display: contents; } /* '열기' 칩과 한 줄로 이어지게 */
  /* '○○ 열기' 칩 — PC 리스트형에선 줄을 누르면 펼치기라, 카드 주소로 가는 길은 이 칩 (카드형 · 휴대폰에선 숨김 — 줄을 누르면 바로 열리므로) */
  .subs-self { display: none; }
  #groups.list .card.expand .subs-self { display: inline-flex; gap: var(--s-4); /* 모양은 .chip */
    background: var(--soft); color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone); font-weight: 600; }
  #groups.list .card.expand .subs-self:focus-visible, #groups.list .card.expand .subs-self:active { background: var(--tone); color: var(--card); }
  @media (hover: hover) { #groups.list .card.expand .subs-self:hover { background: var(--tone); color: var(--card); } }
  #groups.list .card.expand .subs-row > .x { opacity: 1; visibility: visible; transform: none; transition: background-color var(--dur) ease, color var(--dur) ease; }
  #groups.list .card.expand .subs-row > .over { display: inline-flex; }
  /* 줄에 마우스를 올리면 바탕이 --bg 가 되어 --chip 칩과 구분이 안 되므로, 리스트형 칩은 카드색 바탕 + 테두리 */
  #groups.list .card.expand .subs-row > a { background: var(--card); box-shadow: inset 0 0 0 1px var(--line-strong); }
  #groups.list .card.expand .subs-row > a:focus-visible, #groups.list .card.expand .subs-row > a:active { background: var(--soft); box-shadow: inset 0 0 0 1px var(--tone); }
  @media (hover: hover) { #groups.list .card.expand .subs-row > a:hover { background: var(--soft); box-shadow: inset 0 0 0 1px var(--tone); } }
  #groups.list .card.soon { opacity: .72; }
  @media (max-width: 1023px) { #groups.list .url { display: none; } }
  @media (max-width: 767px) {
    #groups.list .body { flex-direction: column; align-items: flex-start; gap: var(--s-2); }
    #groups.list .top { flex: none; max-width: 100%; }
    #groups.list .desc { max-width: 100%; }
  }

  /* ── 빈 상태 · 아래쪽 ──────────────────────── */
  .empty { padding: var(--s-48) var(--s-16); border: 1px dashed var(--line-strong); border-radius: var(--r-16); text-align: center; color: var(--muted); }
  .empty h2 { margin: 0 0 var(--s-4); overflow-wrap: anywhere; color: var(--text); font-size: var(--fs-md); }
  .empty p { margin: 0 0 var(--s-16); font-size: var(--fs-sm); }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s-4) var(--s-16);
    margin-top: var(--s-64); padding-top: var(--s-20); border-top: 1px solid var(--line); color: var(--faint); font-size: var(--fs-xs); }
  @media (pointer: coarse) { footer .keys { display: none; } }

  /* ── 터치 화면 — 누르는 곳 넓히기 (공용 .ibtn · .chip 은 common.css) ── */
  @media (pointer: coarse) {
    .subs-more { position: relative; }
    .subs-more::after { content: ''; position: absolute; inset: calc(var(--s-12) * -1) calc(var(--s-8) * -1); } /* 높이 20 → 누르는 곳 44px */
    .brand::after { content: ''; position: absolute; inset: calc(var(--s-8) * -1); } /* 로고 32 → 48px */
    .brand { position: relative; }
    /* 리스트형: ⌄ 와 ☆ 의 누르는 곳이 겹치지 않게 ⌄ 를 왼쪽으로 */
    #groups.list { --acc-gap: var(--s-8); }
    #groups.list .card:not(.soon) .body { padding-right: calc(var(--s-64) + var(--s-16)); }
  }

  /* ── 휴대폰: 로고 + 검색칸 한 줄 (제목은 화면 읽기용으로만) · 위아래 여백 줄이기 ── */
  @media (max-width: 767px) {
    :root { --card-pad: var(--s-12); }
    .name { font-size: var(--fs-md); } /* 카드 이름 18 → 16px (설명 14px 와 위계는 유지) */
    .wrap { padding-top: var(--s-16); }
    .viewbar { margin-bottom: var(--s-8); }
    .sec { margin-top: var(--s-32); }
    footer { margin-top: var(--s-40); }
    .hd-in { gap: var(--s-12); }
    .brand h1 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; } /* = .sr-only */
    .search { flex: 1 1 auto; }
    #groups.list .card.expand .subs-self { display: none; } /* 휴대폰 리스트형은 줄을 누르면 바로 열린다 — '○○ 열기' 칩이 필요 없음 */
    #groups.list .card.expand .url { display: flex; max-width: 100%; margin-top: var(--s-4); } /* 대신 펼치면 줄이 여는 주소(↗)를 설명 아래에 보여 준다 */
    #groups.list .card .main { align-items: flex-start; } /* 아이콘을 위에 붙여 ☆ · ⌄ 와 같은 높이에 (주소가 붙어 줄이 길어져도 그대로) */
  }
  @media (prefers-reduced-motion: reduce) {
    .card:hover, .card:hover .go, .card:hover .go.ext { transform: none !important; }
    .subs-in, .subs-row > .x { transition: none !important; }
  }
</style>
</head>
<body>
<a class="btn primary skip" href="#groups">링크 목록으로 건너뛰기</a>
<header class="hd">
  <div class="hd-in">
    <a class="brand" href="./" aria-label="아이티스 포털 첫 화면">
      <picture class="mark"><source srcset="logo-dark.png" media="(prefers-color-scheme: dark)"><img src="logo.png" alt="" width="32" height="32"></picture>
      <h1>아이티스 포털</h1>
    </a>
    <div class="search" id="search" role="search">
      <label for="q" class="sr-only">링크 찾기</label>
        <i class="lens" data-icon="search"></i>
        <input id="q" name="q" type="search" placeholder="이름 · 주소 · 설명으로 찾기…" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-describedby="status">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <span class="status" id="status" aria-live="polite"></span>
        <button type="button" class="ibtn md clear" id="clear" aria-label="검색어 지우기" data-icon="close"></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="viewbar" id="viewbar">
    <div class="seg" role="group" aria-label="보기 방식">
      <button type="button" class="ibtn" data-view="card" data-icon="grid" aria-pressed="true" aria-label="카드형" title="카드형"></button>
      <button type="button" class="ibtn" data-view="list" data-icon="list" aria-pressed="false" aria-label="리스트형" title="리스트형"></button>
    </div>
  </div>

  <main id="groups" tabindex="-1"></main>
  <span class="sr-only" id="favlive" aria-live="polite"></span>
  <span id="newtab" hidden>새 탭에서 열림</span><!-- 바깥 링크가 aria-describedby 로 함께 읽는 안내 -->
  <div class="empty" id="empty" hidden>
    <h2 id="empty-title">찾는 링크가 없습니다</h2>
    <p>다른 말로 찾아보거나 검색어를 지워 전체 목록을 보세요.</p>
    <button type="button" class="btn" id="reset">전체 목록 보기</button>
  </div>

  <footer>
    <span translate="no">its.itket.com</span>
    <span class="keys"><kbd class="kbd">/</kbd> 찾기 · <kbd class="kbd">Enter</kbd> 첫 결과 열기 · <kbd class="kbd">Esc</kbd> 지우기</span>
  </footer>
</div>
<noscript><p style="text-align:center">링크 목록을 보려면 자바스크립트를 켜 주세요.</p></noscript>
<script src="links.js"></script>
<script>
(() => {
  'use strict';

  /* ── 설정 ─────────────────────────────────── */
  const SUB_MAX = 6;                   // 바로 가기 최대 수 (펼쳤을 때 2줄까지)
  const VIEW_KEY = 'its-portal-view';  // 보기 방식 저장 키 (localStorage)
  const FAV_KEY = 'its-portal-fav';    // 즐겨찾기 저장 키 (localStorage, 카드 id 배열 — 고른 순서)
  const ICONS = {
    chart:  '<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>',
    store:  '<path d="M3 9l1.6-5h14.8L21 9M4 9v11h16V9M3 9h18M9.5 20v-6h5v6"/>',
    office: '<path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 8h3M8 12h3M8 16h3"/>',
    draft:  '<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>',
    link:   '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    out:    '<path d="M7 17 17 7M8 7h9v9"/>',     // 바깥 사이트 (새 탭)
    in:     '<path d="M5 12h14M13 6l6 6-6 6"/>',  // 포털 안
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    close:  '<path d="M6 6l12 12M18 6 6 18"/>',
    grid:   '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    list:   '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    chev:   '<path d="m6 9 6 6 6-6"/>', // 갈매기(더보기 ⌄ · 접기 ⌃)
    star:   '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/>'  // 즐겨찾기
  };

  /* ── 작은 도구 ─────────────────────────────── */
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => el.querySelectorAll(sel);
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
  const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
  const isExt = (u) => /^https?:\/\//.test(u);
  // 화면에 보이는 주소: https:// · www · ? 뒤(로그인 넘김 값 등) · 끝 / 는 뺀다
  const shown = (u) => {
    u = String(u).split(/[?#]/)[0];
    return isExt(u) ? u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '') : 'its.itket.com' + u.replace(/\/$/, '');
  };
  const svg = (name, size = 16, cls = '') =>
    `<svg${cls ? ` class="${cls}"` : ''} width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.link}</svg>`;
  const arrow = (url, cls) => svg(isExt(url) ? 'out' : 'in', 12, cls); // 작은 화살표: 바깥 ↗ · 포털 안 →
  // 이 브라우저에 저장 (localStorage) — 사생활 보호 창 등에서 막혀도 화면은 그대로 동작
  const store = {
    get: (k, fallback) => { try { return localStorage.getItem(k) ?? fallback; } catch (e) { return fallback; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장 못 해도 이번 화면에선 동작 */ } },
  };

  /* ── 템플릿 ───────────────────────────────── */
  // 링크: 바깥 주소면 새 탭 + 화면 읽기 안내를 자동으로 붙인다
  const link = (url, inner, cls = '') => {
    const ext = isExt(url);
    return `<a${cls ? ` class="${cls}"` : ''} href="${esc(url)}"${ext ? ' target="_blank" rel="noopener noreferrer" aria-describedby="newtab"' : ''}>${inner}</a>`;
  };

  // 표시: 준비 중 · 로그인 필요
  const badge = (it, soon) =>
    soon ? '<span class="pill badge soon">준비 중</span>'
      : it.login ? '<span class="pill badge warn">로그인 필요</span>' : '';

  // 바로 가기 판 (칩 화살표는 호버·포커스 때만 보인다 — 바깥 ↗ · 포털 안 →)
  // 리스트형 ⌄ (카드형에선 CSS 로 숨김) — 누르면 이 줄 아래에 바로 가기를 펼친다
  const accBtn = (it, subs, navId) => !subs.length ? '' :
    `<button type="button" class="ibtn acc" aria-expanded="false" aria-controls="${navId}" aria-label="${esc(it.name)} 바로 가기 펼치기">${svg('chev')}</button>`;
  const subsNav = (it, subs, navId) => !subs.length ? '' :
    `<nav class="subs" id="${navId}" aria-label="${esc(it.name)} 바로 가기"><div class="subs-in">` +
      (it.self === false ? '' : link(it.url, esc(it.name) + ' 열기' + arrow(it.url), 'chip subs-self')) + // self: false 면 '열기' 칩 없음 (칩 중에서 골라야 하는 카드)
      `<span class="subs-head"><span class="subs-label">${esc(it.subLabel || '자주 찾는 페이지')}</span>` +
        '<button type="button" class="subs-more" aria-expanded="false" hidden>더보기' + svg('chev', 12, 'chev') + '</button></span>' +
      `<span class="subs-row">${subs.map(([name, url]) => url
        ? link(url, esc(name) + arrow(url, 'sa'), 'chip')
        : `<span class="chip soon">${esc(name)}<small>준비 중</small></span>`).join('')}</span>` + // 주소 없는 칩 = 준비 중
    '</div></nav>';

  // 카드
  // copy: 즐겨찾기 묶음에 넣는 사본 — id 속성을 빼고(원본과 겹치지 않게) 원래 묶음 색(tone)을 붙인다
  const card = (it, copy) => {
    const soon = !!it.soon || !it.url;              // 제작 중: 누를 수 없는 카드
    const url = it.url || '';
    const ext = isExt(url);
    const subs = soon ? [] : (it.sub || []).slice(0, SUB_MAX); // 준비 중은 바로 가기 없음
    const key = slug(it.id);                        // 카드 이름표: links.js 의 id
    const hay = [it.name, it.desc, url, url && shown(url), it.tags, soon ? '준비 중 제작 중' : '', ...subs.map((s) => s[0])].join(' ').toLowerCase();
    const cls = ['card', key, soon ? 'soon' : ext ? 'out' : 'in', it.login && !soon && 'login', subs.length && 'sub', copy && copy.tone].filter(Boolean).join(' ');

    const initial = esc(String(it.name || '?').trim().charAt(0).toUpperCase());
    // 아이콘: 사이트 로고(logo)가 있으면 이미지, 없으면 이름 첫 글자
    const tile = it.logo
      ? `<span class="ico lg tile logo" aria-hidden="true" data-initial="${initial}"><img src="${esc(it.logo)}" alt="" width="24" height="24" decoding="async"></span>`
      : `<span class="ico lg tile" aria-hidden="true">${initial}</span>`;
    const body =
      tile +
      '<div class="body">' +
        `<div class="top"><h3 class="name" title="${esc(it.name)}">${esc(it.name)}</h3>${badge(it, soon)}</div>` + // 카드 제목 = h3 (묶음 h2 아래)
        (it.desc ? `<span class="desc" title="${esc(it.desc)}">${esc(it.desc)}</span>` : '') +
        (soon || it.desc === shown(url) ? '' : `<span class="url" translate="no"><span class="u">${esc(shown(url))}</span>${arrow(url, ext ? 'go ext' : 'go')}</span>`) +
      '</div>';

    const navId = `${key || 'c'}${copy ? '-fav' : ''}-subs`; // 즐겨찾기 사본과 겹치지 않게
    const star = soon || !key ? '' :              // 준비 중 카드는 즐겨찾기 없음
      `<button type="button" class="ibtn star" data-fav="${key}" aria-pressed="false" aria-label="${esc(it.name)} 즐겨찾기">${svg('star')}</button>`;
    return `<article${key && !copy ? ` id="${key}"` : ''} class="${cls}" data-hay="${esc(hay)}">` +
      (soon ? `<div class="main">${body}</div>` : link(url, body, 'main')) +
      star +
      accBtn(it, subs, navId) +
      subsNav(it, subs, navId) +
    '</article>';
  };

  // 묶음 틀 (제목 · 개수 · 카드 격자) — 일반 묶음과 즐겨찾기 묶음이 같이 쓴다
  const secBox = ({ key, tone, icon, title, note, cards, n }) => {
    const tid = key + '-title';
    return `<section id="${key}" class="sec ${key}${tone ? ' ' + tone : ''}" aria-labelledby="${tid}">` +
      `<h2 id="${tid}"><span class="ico sm gi">${svg(icon)}</span>${esc(title)}` +
        `<span class="pill count" data-total="${n}">${n}</span>${note ? `<small>${esc(note)}</small>` : ''}</h2>` +
      `<div class="grid ${key}">${cards}</div>` +
    '</section>';
  };
  // 일반 묶음 — 그리면서 즐겨찾기용 카드 목록(byId)을 모은다
  const byId = {};
  const section = (g, gi) => {
    const key = slug(g.id) || 'g' + gi;             // 섹션 이름표: links.js 의 id
    const tone = 't' + ((gi % 4) + 1);              // 묶음 색 1→4 반복
    g.items.forEach((it) => { if (it.id && !it.soon && it.url) byId[slug(it.id)] = { it, tone }; });
    return secBox({ key, tone, icon: g.icon, title: g.group, note: g.note, cards: g.items.map((it) => card(it)).join(''), n: g.items.length });
  };

  /* ── 그리기 ───────────────────────────────── */
  const groups = (window.PORTAL_LINKS || []).filter((g) => g && g.items && g.items.length);
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  const root = $('#groups');
  root.innerHTML = groups.map(section).join('');
  // 로고를 못 불러오면 이름 첫 글자로 돌아간다
  const logoFallback = (el) => $$('.tile.logo img', el).forEach((img) => img.addEventListener('error', () => {
    const t = img.parentNode;
    t.classList.remove('logo');
    t.textContent = t.dataset.initial;
  }, { once: true }));
  logoFallback(root);
  // 화면에 고정된 아이콘 — 버튼(지우기·보기 방식)은 안에 넣고, <i data-icon> 자리표시(돋보기)는 같은 class 의 svg 로 바꿔 끼운다
  $$('[data-icon]').forEach((el) => { if (el.tagName === 'I') el.outerHTML = svg(el.dataset.icon, 16, el.className); else el.innerHTML = svg(el.dataset.icon); });
  if (location.protocol === 'file:') $('.brand').setAttribute('href', 'index.html'); // 로컬 확인 때 로고가 폴더 목록을 열지 않게

  /* ── 바로 가기 크기 재기 ─────────────────────
     접힌 높이(첫 줄까지)·펼친 높이(전체)를 재서 CSS 변수로 넣고,
     둘째 줄 칩에 .x(펼칠 때 차례로 떠오름), 셋째 줄부터 .over(숨김)를 붙이고 둘째 줄 수를 '더보기 +N' 에 적는다 */
  // '더보기 +N' / '접기' — 버튼의 첫 글자 마디만 바꾼다 (뒤의 화살표 svg 는 그대로)
  const moreText = (btn, open) => { btn.firstChild.nodeValue = open ? '접기' : `더보기 +${btn.dataset.n || ''}`; };
  const ROW_PAD = 4;   // .subs-row 위아래 여백 · .subs-in 아래 여백 (각 4px)
  const fitSubs = () => {
    if (root.classList.contains('list')) return; // 리스트형은 바로 가기를 숨기므로 잴 것 없음
    root.classList.add('measure');
    $$('.subs', root).forEach((nav) => {
      const box = $('.subs-in', nav);
      const more = $('.subs-more', nav);
      const chips = $$('.subs-row > *', nav);
      ['--subs-h', '--subs-c', '--subs-o'].forEach((v) => nav.style.removeProperty(v));
      chips.forEach((a) => { a.classList.remove('x', 'over'); a.style.removeProperty('--k'); });
      if (!nav.offsetParent || !chips.length) return;   // 숨은 카드(검색·리스트형)는 건너뜀

      // 줄 나누기: 첫 줄은 늘 보임, 둘째 줄 .x, 셋째 줄부터 .over
      const line1 = chips[0].offsetTop;
      let line2 = null;
      let k = 0;
      chips.forEach((a) => {
        const t = a.offsetTop;
        if (t <= line1 + 2) return;
        if (line2 === null) line2 = t;
        if (t > line2 + 2) { a.classList.add('over'); return; }
        a.classList.add('x');
        a.style.setProperty('--k', k++);
      });

      // 위치는 .over 로 셋째 줄을 숨긴 뒤에 잰다 — 판이 아래에 붙어 있어 숨기면 위쪽이 한 줄 내려오기 때문
      const top = box.getBoundingClientRect().top;
      const closed = Math.ceil(chips[0].getBoundingClientRect().bottom - top) + ROW_PAD * 2;
      const open = box.scrollHeight;
      nav.style.setProperty('--subs-c', closed + 'px');
      nav.style.setProperty('--subs-o', Math.max(open, closed) + 'px');

      nav.style.setProperty('--subs-h', (closed - ROW_PAD) + 'px'); // 판이 아래로 나온 만큼(포커스 링 여유) 뺀다
      more.hidden = k === 0;
      more.dataset.n = k;
      moreText(more, nav.closest('.card').classList.contains('open'));
    });
    root.classList.remove('measure');
  };

  /* ── 보기 방식: 카드형(기본) · 리스트형 — 고른 것은 이 브라우저에 기억 ── */
  const viewBtns = $$('.seg [data-view]');
  const setView = (v, save) => {
    v = v === 'list' ? 'list' : 'card';
    root.classList.toggle('list', v === 'list');
    viewBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    if (!save) return;
    store.set(VIEW_KEY, v);
    if (v === 'card') fitSubs(); // 카드형으로 돌아오면 다시 잰다 (처음 열 때는 아래 apply 가 잰다)
  };
  // 처음 열 때(고른 적이 없으면) 휴대폰 폭은 리스트형 — 한 화면에 더 많이 보인다. 회전·창 크기 변경으로는 바꾸지 않는다
  setView(store.get(VIEW_KEY, matchMedia('(max-width: 767px)').matches ? 'list' : 'card'), false);
  viewBtns.forEach((b) => b.addEventListener('click', () => setView(b.dataset.view, true)));

  /* ── 검색 ─────────────────────────────────── */
  const q = $('#q');
  const box = $('#search');
  const status = $('#status');
  const empty = $('#empty');
  const emptyTitle = $('#empty-title');
  const viewbar = $('#viewbar');

  const apply = (syncUrl) => {
    const raw = q.value.trim();
    const words = raw.toLowerCase().split(/\s+/).filter(Boolean);
    let found = 0;
    box.classList.toggle('has-value', q.value.length > 0);
    $$('.sec', root).forEach((sec) => {
      if (sec.classList.contains('fav')) { sec.hidden = words.length > 0; return; } // 찾는 중엔 즐겨찾기 묶음을 숨겨 결과가 두 번 나오지 않게
      let visible = 0;
      $$('.card', sec).forEach((c) => {
        const ok = words.every((w) => c.dataset.hay.includes(w));
        c.hidden = !ok;
        if (ok) visible++;
      });
      sec.hidden = visible === 0;
      const cnt = $('.count', sec);
      cnt.textContent = words.length ? `${visible} / ${cnt.dataset.total}` : cnt.dataset.total;
      found += visible;
    });
    empty.hidden = found > 0 || total === 0;
    viewbar.hidden = found === 0; // 보여 줄 카드가 없으면 보기 방식 버튼도 숨김
    if (!found && words.length) emptyTitle.textContent = `‘${raw}’에 맞는 링크가 없습니다`;
    // 보이는 글자는 짧게("3개"/"없음"), 화면 읽기에는 전체 안내
    status.innerHTML = !words.length ? ''
      : found ? `${found}개<span class="sr-only"> 찾음 · Enter 로 첫 결과 열기</span>`
      : '없음<span class="sr-only"> · 검색 결과 없음</span>';
    if (syncUrl) {
      const url = new URL(location.href);
      if (raw) url.searchParams.set('q', raw); else url.searchParams.delete('q');
      try { history.replaceState(null, '', url); } catch (e) { /* file:// 등 */ }
    }
    fitSubs();
  };
  const clear = (focus) => { q.value = ''; apply(true); if (focus) q.focus(); };

  /* ── 바로 가기 '더보기' — 눌러서 펼치고 접기. 한 번에 하나만, 바깥을 누르거나 Esc 로 닫힘 ── */
  const closeOpen = (except) => {
    $$('.card.open', root).forEach((c) => {
      if (c === except) return;
      c.classList.remove('open');
      const btn = $('.subs-more', c);
      btn.setAttribute('aria-expanded', 'false');
      moreText(btn, false);
    });
  };
  const toggleMore = (btn) => {
    const c = btn.closest('.card');
    const open = !c.classList.contains('open');
    closeOpen(c);
    c.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    moreText(btn, open);
  };
  document.addEventListener('click', (e) => { if (!e.target.closest('.card.open')) closeOpen(); });

  /* ── 리스트형 아코디언 — ⌄ 를 누르면 그 줄의 바로 가기를 펼치고 접는다 (여러 줄 동시에 펼쳐도 됨) ── */
  // PC 리스트형: 바로 가기가 있는 줄을 눌러도 펼친다 (카드 주소는 펼친 칩 맨 앞 '○○ 열기')
  // 휴대폰 폭(767px 이하): 줄을 누르면 바로 열고, 펼치기는 ⌄ 로만 — 가장 많이 하는 '들어가기'를 한 번에 (카드형과 같은 규칙)
  //  · Ctrl/⌘/Shift/Alt 클릭(새 탭 등)과 검색창 Enter(첫 결과 열기, data-go)는 원래대로 링크 이동
  const phone = matchMedia('(max-width: 767px)'); // 누를 때마다 확인 — 회전해도 맞게
  const toggleAcc = (c) => {
    const btn = $('.acc', c);
    const open = !c.classList.contains('expand');
    c.classList.toggle('expand', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', btn.getAttribute('aria-label').replace(/ 바로 가기 (펼치기|접기)$/, open ? ' 바로 가기 접기' : ' 바로 가기 펼치기'));
  };
  const clickMain = (main, e) => {
    const go = main.dataset.go;
    delete main.dataset.go;
    const c = main.closest('.card');
    if (go || phone.matches || !root.classList.contains('list') || !c.classList.contains('sub')) return;
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    toggleAcc(c);
  };

  /* ── 즐겨찾기 — 카드 ☆ 를 누르면 맨 위 '즐겨찾기' 묶음에 모인다 (이 브라우저에만 저장, DB 없음) ── */
  const favLive = $('#favlive');
  let favs = [];
  try { favs = JSON.parse(store.get(FAV_KEY, '[]')); } catch (e) { /* 깨진 값 */ }
  favs = Array.isArray(favs) ? favs.filter((id, i) => byId[id] && favs.indexOf(id) === i) : []; // 없어진 카드 · 중복은 뺀다
  const saveFavs = () => store.set(FAV_KEY, JSON.stringify(favs));
  const renderFav = () => {
    $('#fav', root)?.remove();
    if (favs.length) {
      root.insertAdjacentHTML('afterbegin', secBox({
        key: 'fav', icon: 'star', title: '즐겨찾기', note: '☆ 를 눌러 고른 카드 · 이 브라우저에만 저장',
        cards: favs.map((id) => card(byId[id].it, { tone: byId[id].tone })).join(''), n: favs.length,
      }));
      logoFallback($('#fav', root));
    }
    $$('.star', root).forEach((b) => {
      const on = favs.includes(b.dataset.fav);
      b.setAttribute('aria-pressed', String(on));
      b.title = on ? '즐겨찾기에서 빼기' : '즐겨찾기에 추가';
    });
  };
  const toggleFav = (btn, e) => {
    const id = btn.dataset.fav;
    const fromFav = !!btn.closest('.sec.fav');
    const next = fromFav ? btn.closest('.card').nextElementSibling : null; // 키보드로 뺄 때 포커스를 옮길 곳
    const on = !favs.includes(id);
    favs = on ? [...favs, id] : favs.filter((f) => f !== id);
    saveFavs();
    renderFav();
    apply(false);
    favLive.textContent = `${byId[id].it.name} — 즐겨찾기${on ? '에 추가' : '에서 뺌'}`;
    if (fromFav && e.detail === 0) { // 키보드(Enter·Space)로 누른 경우만 포커스를 이어 준다
      const nextId = next && $('.star', next)?.dataset.fav;
      ($(`#fav .star[data-fav="${nextId}"]`, root) || $(`#${id} .star`, root))?.focus();
    }
  };
  renderFav();

  /* ── 목록 안 누르기 — 한 곳에서 받아 나눠 준다 (더보기 · ⌄ · ☆ · 카드 링크) ── */
  root.addEventListener('click', (e) => {
    const t = e.target;
    let el;
    if ((el = t.closest('.subs-more'))) return toggleMore(el);
    if ((el = t.closest('.acc'))) return toggleAcc(el.closest('.card'));
    if ((el = t.closest('.star'))) return toggleFav(el, e);
    if ((el = t.closest('a.main'))) return clickMain(el, e);
  });

  /* ── 시작 · 이벤트 ─────────────────────────── */
  q.value = new URLSearchParams(location.search).get('q') || '';
  if (total === 0) { empty.hidden = false; emptyTitle.textContent = '등록된 링크가 없습니다'; $('#reset').hidden = true; }
  apply(false);

  let fitQueued = false;
  window.addEventListener('resize', () => {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fitSubs(); });
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSubs);

  q.addEventListener('input', () => apply(true));
  q.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing || !q.value.trim()) return;
    const first = $('.sec:not([hidden]) .card:not([hidden]) a.main', root); // 숨은 묶음(찾는 중의 즐겨찾기) 안 카드는 건너뜀
    if (first) { e.preventDefault(); first.dataset.go = '1'; first.click(); } // data-go: 리스트형에서도 펼치지 말고 바로 연다
  });
  $('#clear').addEventListener('click', () => clear(true));
  $('#reset').addEventListener('click', () => clear(true));
  document.addEventListener('keydown', (e) => {
    const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !typing) { e.preventDefault(); q.focus(); q.select(); }
    if (e.key === 'Escape') {
      if (document.activeElement === q) { if (q.value) clear(false); else q.blur(); }
      else closeOpen();
    }
  });
})();
</script>
</body>
</html>
