<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>아이티스 마케팅 도구</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M9 22V13M16 22V9M23 22v-6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --card: #171a21; --text: #e5e7eb; --muted: #9ca3af; --line: #262b36; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Pretendard, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.sub { margin: 0 0 32px; color: var(--muted); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.svc { display: block; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .15s; }
  a.svc:hover, a.svc:focus-visible { border-color: var(--accent); outline: none; }
  .name { font-weight: 700; font-size: 16px; }
  .path { color: var(--accent); font-size: 13px; margin-left: 6px; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>아이티스 마케팅 도구</h1>
  <p class="sub">마케팅팀이 쓰는 대시보드 모음입니다.</p>
  <ul>
    <li><a class="svc" href="/ad-insight/"><span class="name">광고 인사이트</span><span class="path">/ad-insight</span><div class="desc">매체 광고비·견적·카테고리 효율·키워드·구매·이용 현황</div></a></li>
    <li><a class="svc" href="/analytics/"><span class="name">사이트 분석</span><span class="path">/analytics</span><div class="desc">아이티켓 방문·유입·페이지·전환 (GA4)</div></a></li>
  </ul>
</main>
</body>
</html>
